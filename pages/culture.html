<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Культура Китая - China Beyond the Wall</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header class="header">
        <!-- Такая же навигация как в index.html -->
    </header>

    <section class="hero" style="background-image: url('../images/culture-hero.jpg')">
        <div class="hero-content">
            <h1>Культура и Традиции Китая</h1>
            <p>Погрузитесь в богатейшее культурное наследие Поднебесной</p>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <article id="art">
                <h2>Традиционное искусство</h2>
                <!-- Контент про искусство -->
            </article>
            <!-- Другие подразделы -->
        </div>
    </section>

    <footer class="footer">
        <!-- Футер как в index.html -->
    </footer>
    <!-- Музыкальный плеер -->
<div id="music-player" class="music-player">
    <button id="music-toggle" class="music-btn">🔈 Вкл</button>
    
    <div class="volume-control">
        <span class="volume-icon">🔊</span>
        <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.1" value="0.5">
    </div>
</div>

<!-- Аудио элемент -->
<audio id="bg-music" loop preload="auto">
    <source src="../music/bb0718fa61886da.mp3" type="audio/mpeg">
    Ваш браузер не поддерживает аудио элемент.
</audio>

<script src="../music-player.js"></script>
</body>
</html>
